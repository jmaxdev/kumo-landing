server {
    listen 80;
    server_name kumo.jmaxdev.site localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SEO / security trust signals
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/ld+json;
    gzip_min_length 1000;

    # robots.txt & sitemap — crawlable, short cache
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        default_type application/xml;
        try_files $uri =404;
    }

    # SPA Routing Fallback for Client-side Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Brand icon — moderate cache
    location = /icon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Error pages
    error_page 500 502 503 504 /500.html;
}
