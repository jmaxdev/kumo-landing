services:
  kumo-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kumo-landing
    restart: unless-stopped
    ports:
      - 80
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s